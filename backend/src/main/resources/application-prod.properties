server.port=${PORT:8081}
spring.application.name=gestion-clinique

# Render injecte SPRING_DATASOURCE_URL, USERNAME, PASSWORD directement
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:CliniqueMedicaleJwtSecretKey2026Secure256BitsXX}
app.jwt.expiration-ms=604800000

app.cors.allowed-origins=${CORS_ORIGINS:https://projet-ia-se.vercel.app}

app.ai.api-url=https://api.groq.com/openai/v1/chat/completions
app.ai.api-key=${GROQ_API_KEY:}
app.ai.model=qwen/qwen3.8-27b

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.clinique=INFO
