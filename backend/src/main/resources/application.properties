server.port=8081
spring.application.name=gestion-clinique

spring.datasource.url=jdbc:mysql://localhost:3306/clinique_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

app.jwt.secret=CliniqueMedicaleJwtSecretKey2026Secure256BitsXX
app.jwt.expiration-ms=604800000

app.cors.allowed-origins=http://localhost:4200

# Groq AI
app.ai.api-url=https://api.groq.com/openai/v1/chat/completions
app.ai.api-key=YOUR_GROQ_API_KEY
app.ai.model=qwen/qwen3.8-27b

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.clinique=INFO
