server.port=${PORT:8081}
spring.application.name=gestion-clinique

# Base de données — Variables d'environnement injectées par Render
spring.datasource.url=${MYSQL_URL:jdbc:mysql://mysql-clinique-esprit-6bbf.c.aivencloud.com:24975/defaultdb?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:avnadmin}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
app.jwt.secret=${JWT_SECRET:CliniqueMedicaleJwtSecretKey2026Secure256BitsXX}
app.jwt.expiration-ms=604800000

# CORS — sera mis à jour avec l'URL Vercel/Render frontend
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Groq AI
app.ai.api-url=https://api.groq.com/openai/v1/chat/completions
app.ai.api-key=${GROQ_API_KEY:}
app.ai.model=qwen/qwen3.8-27b

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.clinique=INFO
