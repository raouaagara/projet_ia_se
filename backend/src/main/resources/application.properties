server.port=8081
spring.application.name=gestion-clinique

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinique_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Secret de signature des jetons : à fournir par variable d'environnement en production
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-medicare-change-me-in-production-2026}
app.jwt.expiration-ms=604800000

app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}

# Assistant IA (Groq, API compatible OpenAI) : sans clé, les fonctions IA utilisent le moteur de règles local
app.ai.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.api-key=${GROQ_API_KEY:}
app.ai.model=${GROQ_MODEL:qwen/qwen3.8-27b}
app.ai.timeout-ms=15000

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.clinique=INFO
