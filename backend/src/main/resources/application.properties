server.port=${PORT:8081}
spring.application.name=gestion-clinique

# Base de données — Railway injecte MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD automatiquement
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/clinique_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT — à définir comme variable d'environnement sur Railway
app.jwt.secret=${JWT_SECRET:CliniqueMedicaleJwtSecretKey2026Secure256BitsXX}
app.jwt.expiration-ms=604800000

# CORS — sera mis à jour avec l'URL Vercel après déploiement
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Groq AI
app.ai.api-url=https://api.groq.com/openai/v1/chat/completions
app.ai.api-key=${GROQ_API_KEY:}
app.ai.model=qwen/qwen3.8-27b

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.clinique=INFO
