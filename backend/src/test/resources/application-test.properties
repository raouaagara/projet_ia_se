# Profil de test : base H2 en mémoire (mode MySQL), aucune dépendance externe.
spring.datasource.url=jdbc:h2:mem:clinique_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,YEAR,MONTH,DAY,USER,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=secret-de-test-medicare-au-moins-32-caracteres
app.cors.allowed-origins=http://localhost:4200

# Jamais d'appel réseau vers le modèle pendant les tests : le moteur de règles local est utilisé.
app.ai.api-key=

logging.level.com.clinique=WARN
logging.level.org.hibernate.SQL=WARN
